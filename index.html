<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Thanjai Property — Where Tamil Nadu's Properties Meet Modern Luxury</title>
    <meta name="description" content="Discover Tamil Nadu's premier luxury villas, modern apartments, DTCP plots, and agricultural farmlands. Thanjai Property - Since 2009." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    
    <!-- Leaflet.js Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="initial-spinner" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; background: #FAF8F5; color: #1c1917; padding: 24px; text-align: center;">
        <img src="/thanjai-official-new.png" alt="Thanjai Property" style="height: 54px; margin-bottom: 20px; object-fit: contain;" onerror="this.style.display='none'" />
        <div style="width: 36px; height: 36px; border: 3px solid #ffedd5; border-top-color: #eb5e28; border-radius: 50%; animation: initialSpin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin: 0 0 6px 0; font-family: 'DM Serif Display', Georgia, serif;">Thanjai Property</h2>
        <p style="color: #64748b; font-size: 0.88rem; margin: 0;">Loading Tamil Nadu's Premier Real Estate Platform...</p>
        <style>@keyframes initialSpin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      setTimeout(function() {
        var spinner = document.getElementById('initial-spinner');
        if (spinner) {
          spinner.parentNode.innerHTML = '<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; background: #FAF8F5; color: #1c1917; padding: 24px; text-align: center;"><img src="/thanjai-official-new.png" alt="Thanjai Property" style="height: 54px; margin-bottom: 20px; object-fit: contain;" onerror="this.style.display=\'none\'" /><h2 style="font-size: 1.35rem; font-weight: 800; color: #eb5e28; margin-bottom: 12px;">Thanjai Property Official</h2><p style="color: #64748b; max-width: 480px; margin-bottom: 24px; font-size: 0.95rem; line-height: 1.6;">Click below to load the latest version of Thanjai Property.</p><button onclick="window.location.reload(true)" style="background: #eb5e28; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(235,94,40,0.3);">Refresh Page</button></div>';
        }
      }, 4500);
    </script>
  </body>
</html>
